name: Cache MahiCloud and MahiFlix logos

on:
  push:
    branches: [main]
    paths:
      - 'web/mahiflix/index.html'
      - 'web/mahiflix/logo-sources.json'
      - 'web/Firefly (1).png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-mahiflix-logos
  cancel-in-progress: false

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check requests Pillow

      - name: Download and optimize logo files
        run: python tools/cache_mahiflix_logos.py

      - name: Commit local logo assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- web/brand-m.webp web/mahiflix/logos web/index.html
          if git diff --cached --quiet; then
            echo "All logo assets are already current."
            exit 0
          fi
          git commit -m "[skip ci] Cache optimized MahiCloud and MahiFlix logos"
          git push origin main
