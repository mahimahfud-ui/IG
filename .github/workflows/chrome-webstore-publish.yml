name: Publish Chrome extension

on:
  push:
    branches: [main]
    paths:
      - "browser-helper/**"
      - ".github/workflows/chrome-webstore-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Chrome Web Store credentials
        id: ready
        shell: bash
        env:
          PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for value in PUBLISHER_ID EXTENSION_ID CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
            if [ -z "${!value:-}" ]; then
              echo "Missing secret: $value"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Web Store secrets are not configured yet. Skipping upload/publish."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto bump patch version
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("browser-helper/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          parts = data["version"].split(".")
          if len(parts) != 3 or not all(x.isdigit() for x in parts):
              raise SystemExit("manifest.json version must be MAJOR.MINOR.PATCH")
          major, minor, patch = map(int, parts)
          data["version"] = f"{major}.{minor}.{patch + 1}"
          data["version_name"] = f"{data['version']} · Chrome Web Store"
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("Version:", data["version"])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-helper/manifest.json
          git diff --cached --quiet || git commit -m "chore: bump Chrome extension version [skip ci]"
          git push

      - name: Package extension
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f mahi-instagram-helper.zip
          cd browser-helper
          zip -r ../mahi-instagram-helper.zip . -x "*.DS_Store"

      - name: Get Google OAuth access token
        if: steps.ready.outputs.ready == 'true'
        id: token
        env:
          CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail-with-body -sS -X POST https://oauth2.googleapis.com/token             -d client_id="$CLIENT_ID"             -d client_secret="$CLIENT_SECRET"             -d refresh_token="$REFRESH_TOKEN"             -d grant_type=refresh_token)

          TOKEN=$(python -c 'import sys,json; print(json.load(sys.stdin)["access_token"])' <<< "$RESPONSE")
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload package to Chrome Web Store
        if: steps.ready.outputs.ready == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS             -H "Authorization: Bearer $TOKEN"             -X POST             -T mahi-instagram-helper.zip             "https://chromewebstore.googleapis.com/upload/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:upload"

      - name: Publish submission
        if: steps.ready.outputs.ready == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS             -H "Authorization: Bearer $TOKEN"             -X POST             "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:publish"
