name: Publish Chrome extension

on:
  push:
    branches: [main]
    paths:
      - "browser-helper/**"
      - ".github/workflows/chrome-webstore-publish.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read extension version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json
          with open("browser-helper/manifest.json", encoding="utf-8") as f:
              print(json.load(f)["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package extension
        shell: bash
        run: |
          rm -f mahi-instagram-helper.zip
          cd browser-helper
          zip -r ../mahi-instagram-helper.zip . -x "*.DS_Store"

      - name: Check Web Store credentials
        id: ready
        shell: bash
        env:
          PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
        run: |
          if [ -z "$PUBLISHER_ID" ] || [ -z "$EXTENSION_ID" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "Chrome Web Store credentials are not configured yet. Skipping publish."
            echo "See STORE_LISTING.md for one-time setup."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Get Google access token
        id: token
        if: steps.ready.outputs.ready == 'true'
        env:
          CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
        shell: bash
        run: |
          TOKEN=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token | python -c "import sys,json; d=json.load(sys.stdin); print(d['access_token'])")
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload new package
        if: steps.ready.outputs.ready == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
        shell: bash
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $TOKEN" \
            -X POST \
            -T mahi-instagram-helper.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:upload"

      - name: Publish for review
        if: steps.ready.outputs.ready == 'true'
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
        shell: bash
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $TOKEN" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:publish"
