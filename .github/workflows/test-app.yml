name: MahiCloud route tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, integrate/project-route-aliases]

jobs:
  route-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test routes and integrated assets
        run: python -m unittest discover -s tests -v
