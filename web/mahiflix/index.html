.mobile-actions .round{pointer-events:auto;width:31px;height:31px;background:rgba(10,10,11,.75);backdrop-filter:blur(12px);box-shadow:0 4px 14px rgba(0,0,0,.22)}
.mobile-actions .mobile-download{margin-left:auto;margin-right:0}.mobile-actions .mobile-fav{margin-right:auto}.mode-switch{max-width:100%}.row-note{display:none}
}
@media(max-width:380px){.hero-kicker{letter-spacing:.11em}.hero-actions{gap:9px}.hero-browse{padding:0 14px;gap:12px}.mode{padding:10px 13px}.card{flex-basis:73vw}}
@media(prefers-reduced-motion:reduce){.view.active{animation:none!important}.card.live{animation:none!important}.hero-browse,.round,.arrow{transition:none!important}}

];

const adLabel=["No / minimal ads","Some ads","More / heavier ads"];
const adClass=["a0","a1","a2"];

const clean=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=n=>n.replace(/[^a-z0-9 ]/gi,"").split(/\s+/).map(x=>x[0]||"").join("").slice(0,2).toUpperCase();
const hue=n=>{let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h};

function logoHTML(it){
  const sources=[
    ...(it.logoSources||[]),
    "https://"+it.domain+"/favicon.ico",
    "https://"+it.domain+"/favicon.png",
    "https://"+it.domain+"/favicon.svg",
    "https://www.google.com/s2/favicons?sz=256&domain="+encodeURIComponent(it.domain),
    "https://icons.duckduckgo.com/ip3/"+encodeURIComponent(it.domain)+".ico"
  ];
  const json=JSON.stringify(sources);
  return "<img loading='lazy' fetchpriority='low' decoding='async' alt='"+clean(it.name)+" logo' src='"+sources[0]+"' data-logo-sources='"+clean(json)+"' data-logo-index='0' onerror='nextLogo(this)'>";
}
function nextLogo(img){
  try{
    const sources=JSON.parse(img.getAttribute("data-logo-sources")||"[]");
    const index=Number(img.getAttribute("data-logo-index")||"0")+1;
    if(index<sources.length){
      img.setAttribute("data-logo-index",String(index));
      img.src=sources[index];
      return;
    }
  }catch(e){}
  const name=img.alt.replace(/ logo$/i,"");
  img.outerHTML="<span class='initials' aria-label='"+clean(name)+" logo'>"+initials(name)+"</span>";
}
function linkOf(it){return it.url}
const FAV_KEY="mahiflix-favourites-v1";
function readFavourites(){try{return new Set(JSON.parse(localStorage.getItem(FAV_KEY)||"[]"))}catch(e){return new Set()}}
const favourites=readFavourites();
function saveFavourites(){try{localStorage.setItem(FAV_KEY,JSON.stringify(Array.from(favourites)))}catch(e){}}
function favButton(it,extra){
  const on=favourites.has(it.name);
  return "<button class='round fav "+(extra||"")+"' type='button' data-fav-for='"+clean(it.name)+"' aria-pressed='"+(on?"true":"false")+"' aria-label='"+(on?"Remove "+clean(it.name)+" from My List":"Add "+clean(it.name)+" to My List")+"' title='"+(on?"Remove from My List":"Add to My List")+"'>"+(on?"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12l5 5 9-10'/></svg>":svgPlus())+"</button>";
}
function downloadLink(it,extra){
  if(!it.downloadUrl)return "";
  return "<a class='round download "+(extra||"")+"' href='"+clean(it.downloadUrl)+"' aria-label='Download "+clean(it.name)+" APK' title='Download APK'>"+svgDownload()+"</a>";
}
function svgDownload(){return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3v12m-5-5 5 5 5-5'/><path d='M5 17v3h14v-3'/></svg>"}


function qualityScore(it){
  return (it.pop*.42)+(it.smooth*.30)+(it.langs*.18)+((2-it.ads)*10);
}

const top10=[...S].sort((a,b)=>qualityScore(b)-qualityScore(a)).slice(0,10);

function bucket(arr,n){
  return arr.filter(x=>x.ads===n).sort((a,b)=>qualityScore(b)-qualityScore(a));
}

function card(it,i,isTop){
  const c1=it.color||("hsl("+hue(it.name)+" 55% 34%)");
  const num=isTop?"<span class='num'>"+(i+1)+"</span>":"";
  const nw=it.new?"<span class='badge'>NEW</span>":"";
  const ad=it.ads<2?"<span class='ad "+adClass[it.ads]+"'>"+(it.ads===0?"NO AD":"LESS AD")+"</span>":"";
  const url=linkOf(it), desktopFav=favButton(it,""), mobileFav=favButton(it,"mobile-fav");
  const download=downloadLink(it,""), mobileDownload=downloadLink(it,"mobile-download");
  return "<article class='card logo-card live' tabindex='0' aria-label='"+clean(it.name)+" card. Press Enter to visit website.' style='--c1:"+c1+";--c2:#0d0d0d' data-name='"+clean(it.name.toLowerCase())+"' data-search='"+clean((it.name+" "+it.domain).toLowerCase())+"'>"+
    num+logoHTML(it)+nw+ad+
    "<div class='mobile-actions'>"+mobileFav+mobileDownload+"</div>"+
    "<a class='cap' href='"+clean(url)+"' target='_blank' rel='noopener noreferrer'><span>"+clean(it.name)+"</span><span class='cap-open'>VISIT HOME ↗</span></a>"+
    "<div class='more'><div class='actions'><a class='round go' href='"+clean(url)+"' target='_blank' rel='noopener noreferrer' aria-label='Visit "+clean(it.name)+" homepage' title='Visit homepage'>"+svgPlay()+"</a>"+download+desktopFav+"</div>"+
    "<b>"+clean(it.name)+"</b><p>"+clean(it.desc)+"</p><p class='lang'>Language coverage score · "+clean(it.langs)+"/100</p><p class='card-domain'>"+clean(it.domain)+"</p></div></article>";
}



function renderView(type){
  const el=document.getElementById(type==="sites"?"sitesView":"appsView");
  const data=type==="sites"?S:A;
  const label=type==="sites"?"Websites":"Apps";
  const sorted=data.slice().sort((a,b)=>qualityScore(b)-qualityScore(a));
  el.innerHTML=rowHTML(label,sorted,{kind:type==="sites"?"site":"app",note:"Your curated MahiFlix collection"});
}

renderView("sites");
renderView("apps");
document.querySelectorAll('.track').forEach(function(t){t.querySelectorAll('.card').forEach(function(card,i){card.style.animationDelay=(Math.min(i,8)*55)+'ms'})});
function svgPlay(){return "<svg viewBox='0 0 24 24' fill='currentColor'><path d='M6 4l14 8-14 8z'/></svg>"}
function svgPlus(){return "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='3' stroke-linecap='round'><path d='M12 5v14M5 12h14'/></svg>"}
function rowHTML(title,items,opts){
  if(!items.length)return "";
  var top=opts&&opts.top;
  var note=opts&&opts.note?opts.note:"";
  return "<section class='row "+(top?"top10 ":"")+"row-section' data-row='"+clean(title.toLowerCase())+"'><div class='row-head'><h2>"+clean(title)+"</h2><span class='row-note'>"+clean(note)+"</span></div><div class='rail'><button class='arrow l' aria-label='Scroll left'>&#8249;</button><div class='track'>"+items.map(function(it,i){return card(it,i,top)}).join("")+"</div><button class='arrow r' aria-label='Scroll right'>&#8250;</button></div></section>";
}

function setHero(type){}

document.querySelectorAll(".mode").forEach(function(btn){
  btn.addEventListener("click",function(){
    document.querySelectorAll(".mode").forEach(function(x){x.classList.remove("active");x.setAttribute("aria-selected","false")});
    btn.classList.add("active");btn.setAttribute("aria-selected","true");
    var mode=btn.dataset.mode;
    document.getElementById("sitesView").classList.toggle("active",mode==="sites");
    document.getElementById("appsView").classList.toggle("active",mode==="apps");
    document.getElementById("q").value="";
    document.querySelectorAll(".card").forEach(function(card){card.style.display=""});
    document.querySelectorAll(".row-section").forEach(function(row){row.style.display=""});
    document.getElementById("empty").style.display="none";
      });
});

document.querySelectorAll(".rail").forEach(function(r){
  var t=r.querySelector(".track");
  r.querySelector(".l").onclick=function(){t.scrollBy({left:-t.clientWidth*.82,behavior:"smooth"})};
  r.querySelector(".r").onclick=function(){t.scrollBy({left:t.clientWidth*.82,behavior:"smooth"})};
});
document.addEventListener("click",function(e){
  var f=e.target.closest(".fav");
  if(f){
    var name=f.dataset.favFor||"";
    if(favourites.has(name))favourites.delete(name);else favourites.add(name);
    saveFavourites();
    document.querySelectorAll(".fav").forEach(function(button){
      if(button.dataset.favFor!==name)return;
      var on=favourites.has(name);
      button.setAttribute("aria-pressed",on?"true":"false");
      button.setAttribute("aria-label",on?"Remove "+name+" from My List":"Add "+name+" to My List");
      button.title=on?"Remove from My List":"Add to My List";
      button.innerHTML=on?"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12l5 5 9-10'/></svg>":svgPlus();
    });
    return;
  }
  var cardEl=e.target.closest(".card");
  if(cardEl && !e.target.closest("a,button")){
    var name=cardEl.dataset.name||"";
    var current=(document.querySelector(".view.active")===document.getElementById("appsView"))?A:S;
    var item=current.find(function(x){return x.name.toLowerCase()===name;});
    if(item && item.url)window.open(item.url,"_blank","noopener,noreferrer");
  }
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter" && e.key!==" ")return;
  var cardEl=e.target.closest(".card");
  if(!cardEl || e.target.closest("a,button"))return;
  e.preventDefault();
  var name=cardEl.dataset.name||"";
  var current=(document.querySelector(".view.active")===document.getElementById("appsView"))?A:S;
  var item=current.find(function(x){return x.name.toLowerCase()===name;});
  if(item && item.url)window.open(item.url,"_blank","noopener,noreferrer");
});

var sb=document.getElementById("search"),q=document.getElementById("q");
document.getElementById("sbtn").onclick=function(){sb.classList.toggle("open");if(sb.classList.contains("open"))q.focus()};
q.addEventListener("input",function(){
  var v=q.value.trim().toLowerCase(),active=document.querySelector(".view.active"),any=false;
  active.querySelectorAll(".row-section").forEach(function(r){
    var count=0;
    r.querySelectorAll(".card").forEach(function(c){var m=!v||(c.dataset.search||c.dataset.name).indexOf(v)>-1;c.style.display=m?"":"none";if(m)count++});
    r.style.display=count?"":"none";if(count)any=true;
  });
  document.getElementById("empty").style.display=any?"none":"block";
});

var nav=document.getElementById("nav");
addEventListener("scroll",function(){nav.classList.toggle("solid",scrollY>40)},{passive:true});
document.getElementById("yr").textContent=new Date().getFullYear();

(function(){
  var d=document.documentElement;
  if(!d.classList.contains("intro-on"))return;
  var done=false;
  function end(){if(done)return;done=true;try{sessionStorage.setItem("nf-intro","1")}catch(e){}d.classList.add("intro-leave");setTimeout(function(){d.classList.remove("intro-on","intro-leave")},650)}
  document.getElementById("intro").addEventListener("click",end);setTimeout(end,2750)
})();
</script>
