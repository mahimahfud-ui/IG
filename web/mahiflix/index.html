const clean=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>n.replace(/[^a-z0-9 ]/gi,"").split(/\s+/).map(x=>x[0]||"").join("").slice(0,2).toUpperCase();
const hue=n=>{let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h};

function logoHTML(it){
  const sources=it.logoSources&&it.logoSources.length?it.logoSources.slice():[
    "https://www.google.com/s2/favicons?sz=128&domain="+encodeURIComponent(it.domain),
    "https://icons.duckduckgo.com/ip3/"+encodeURIComponent(it.domain)+".ico",
    "https://"+it.domain+"/favicon.ico"
  ];
  const json=JSON.stringify(sources);
  const local=it.logoAsset?"/mahiflix/logos/"+it.logoAsset+".webp":"";
  const src=local||sources[0];
  return "<img loading='lazy' decoding='async' fetchpriority='low' width='58' height='58' alt='"+clean(it.name)+" logo' src='"+clean(src)+"' data-logo-sources='"+clean(json)+"' data-logo-index='"+(local?"-1":"0")+"' onload='this.classList.add(\"logo-ready\")' onerror='nextLogo(this)'>";
}
function nextLogo(img){
  try{
    const sources=JSON.parse(img.getAttribute("data-logo-sources")||"[]");
    const index=Number(img.getAttribute("data-logo-index")||"0")+1;
    if(index<sources.length){
      img.setAttribute("data-logo-index",String(index));
      img.src=sources[index];
      return;
    }
  }catch(e){}
  const name=img.alt.replace(/ logo$/i,"");
  img.outerHTML="<span class='initials' aria-label='"+clean(name)+" logo'>"+initials(name)+"</span>";
}
function linkOf(it){return it.url}

function qualityScore(it){
  return (it.pop*.42)+(it.smooth*.30)+(it.langs*.18)+((2-it.ads)*10);
}

const top10=[...S].sort((a,b)=>qualityScore(b)-qualityScore(a)).slice(0,10);

function bucket(arr,n){
  return arr.filter(x=>x.ads===n).sort((a,b)=>qualityScore(b)-qualityScore(a));
}

function card(it,i,isTop){

  const ad=it.ads<2?"<span class='ad "+adClass[it.ads]+"'>"+(it.ads===0?"NO AD":"LESS AD")+"</span>":"";
  const url=linkOf(it), desktopFav=favButton(it,""), mobileFav=favButton(it,"mobile-fav");
  const download=downloadLink(it,""), mobileDownload=downloadLink(it,"mobile-download");
  return "<article class='card logo-card live' tabindex='0' aria-label='"+clean(it.name)+" card. Press Enter to visit website.' style='--c1:"+c1+";--c2:#0d0d0d' data-name='"+clean(it.name.toLowerCase())+"' data-url='"+clean(url)+"' data-search='"+clean((it.name+" "+it.domain+" "+(it.desc||"")).toLowerCase())+"'>"+
    num+logoHTML(it)+nw+ad+
    "<div class='mobile-actions'>"+mobileFav+mobileDownload+"</div>"+
    "<a class='cap' href='"+clean(url)+"' target='_blank' rel='noopener noreferrer'><span>"+clean(it.name)+"</span><span class='cap-open'>VISIT HOME ↗</span></a>"+

}



const CUSTOM_KEY="mahiflix-custom-items-v1";
function readCustomItems(type){
  try{
    const all=JSON.parse(localStorage.getItem(CUSTOM_KEY)||"{}");
    return Array.isArray(all[type])?all[type].filter(function(x){return x&&typeof x.name==="string"&&typeof x.url==="string"&&typeof x.domain==="string"}):[];
  }catch(e){return []}
}
function saveCustomItem(type,item){
  const all=(()=>{try{return JSON.parse(localStorage.getItem(CUSTOM_KEY)||"{}")}catch(e){return {}}})();
  if(!Array.isArray(all[type]))all[type]=[];
  if(all[type].some(function(x){return x.url.toLowerCase()===item.url.toLowerCase()}))return false;
  all[type].push(item);
  try{localStorage.setItem(CUSTOM_KEY,JSON.stringify(all));return true}catch(e){return false}
}

function playCardEntrance(container){
  if(!container)return;
  const start=function(){
    const cards=container.querySelectorAll(".card");
    cards.forEach(function(card,i){card.classList.remove("mf-enter");card.style.setProperty("--mf-stagger",String(Math.min(i,10)))});
    void container.offsetWidth;
    cards.forEach(function(card){card.classList.add("mf-enter")});
  };
  if(document.documentElement.classList.contains("intro-on"))document.addEventListener("mahiflix:intro-finished",start,{once:true});
  else start();
}

function renderView(type){
  const el=document.getElementById(type==="sites"?"sitesView":"appsView");
  const base=type==="sites"?S:A;
  const source=base.concat(readCustomItems(type)).filter(function(item,index,all){
    const name=String(item.name||"").trim().toLowerCase();
    return name&&all.findIndex(function(candidate){return String(candidate.name||"").trim().toLowerCase()===name})===index;
  });
  const data=source.map(function(item){
    return Object.assign({},item,{logoAsset:item.logoAsset||localLogoFor(type,item)});
  });
  const label=type==="sites"?"Websites":"Apps";
  const sorted=data.slice().sort(function(a,b){return qualityScore(b)-qualityScore(a)});
  el.innerHTML=rowHTML(label,sorted,{kind:type==="sites"?"site":"app",note:"Your curated MahiFlix collection"});
  /* Bind directly after each render; the modal controller is registered later in this script. */
  el.querySelectorAll(".add-item-btn").forEach(function(btn){
    btn.addEventListener("click",function(event){
      event.preventDefault();
      event.stopPropagation();
      if(typeof window.mahiFlixOpenAdd==="function"){
        window.mahiFlixOpenAdd(btn.dataset.addType==="apps"?"apps":"sites");
      }else{
        const overlay=document.getElementById("mf-add-overlay");
        if(overlay){overlay.classList.add("open");}
        else {console.error("MahiFlix add dialog failed to initialize.");}
      }
    });
  });
  const track=el.querySelector(".track");
  playCardEntrance(el);
}

function rowHTML(title,items,opts){
  if(!items.length)return "";

  return "<section class='row row-section' data-row='"+clean(title.toLowerCase())+"'><div class='row-head'><h2>"+clean(title)+"</h2><button class='add-item-btn' type='button' data-add-type='"+kind+"' aria-label='Add "+(kind==="apps"?"app":"website")+"'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' aria-hidden='true'><path d='M12 5v14M5 12h14'/></svg><span>Add "+(kind==="apps"?"App":"Website")+"</span></button></div><div class='rail'><div class='track'>"+items.map(function(it,i){return card(it,i,false)}).join("")+"</div></div></section>";
}

// MahiFlix uses a responsive CSS grid, so there are no horizontal rail arrow controls to initialize.
document.addEventListener("click",function(e){
  var f=e.target.closest(".fav");
  if(f){
    var name=f.dataset.favFor||"";
    if(favourites.has(name))favourites.delete(name);else favourites.add(name);
    saveFavourites();
    document.querySelectorAll(".fav").forEach(function(button){
      if(button.dataset.favFor!==name)return;
      var on=favourites.has(name);
      button.setAttribute("aria-pressed",on?"true":"false");
      button.setAttribute("aria-label",on?"Remove "+name+" from My List":"Add "+name+" to My List");
      button.title=on?"Remove from My List":"Add to My List";
      button.innerHTML=on?"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12l5 5 9-10'/></svg>":svgPlus();
    });
    return;
  }
  var cardEl=e.target.closest(".card");
  if(cardEl && !e.target.closest("a,button")){
    var targetUrl=cardEl.dataset.url||(cardEl.querySelector(".cap")&&cardEl.querySelector(".cap").href);
    if(targetUrl)window.open(targetUrl,"_blank","noopener,noreferrer");
  }
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter" && e.key!==" ")return;
  var cardEl=e.target.closest(".card");
  if(!cardEl || e.target.closest("a,button"))return;
  e.preventDefault();
  var targetUrl=cardEl.dataset.url||(cardEl.querySelector(".cap")&&cardEl.querySelector(".cap").href);
  if(targetUrl)window.open(targetUrl,"_blank","noopener,noreferrer");
});

(function(){
  const ADD_PIN="6993";
  let stage="pin",addType="sites",pendingUrl="",dialogInput=null,errorNode=null;
  const overlay=document.createElement("div");
  overlay.id="mf-add-overlay";

  document.body.appendChild(overlay);
  const title=overlay.querySelector("#mf-add-title"),copy=overlay.querySelector("#mf-add-copy"),label=overlay.querySelector("#mf-add-label"),input=overlay.querySelector("#mf-add-input"),error=overlay.querySelector("#mf-add-error"),form=overlay.querySelector("#mf-add-form"),next=overlay.querySelector("#mf-add-next");
  function open(type){addType=type;stage="pin";pendingUrl="";input.value="";error.textContent="";input.type="password";input.inputMode="numeric";input.autocomplete="current-password";input.placeholder="••••";title.textContent="Enter passcode";copy.textContent="Unlock the add form for "+(type==="apps"?"Apps":"Websites")+".";
    label.textContent="Passcode";input.setAttribute("aria-label","Passcode");next.textContent="Continue";overlay.classList.add("open");setTimeout(function(){input.focus()},40)}
  window.mahiFlixOpenAdd=open;
  function close(){overlay.classList.remove("open");form.reset();error.textContent=""}
  function showUrl(){stage="url";input.value="";input.type="url";input.inputMode="url";input.autocomplete="url";input.placeholder="https://example.com";title.textContent="Website URL";copy.textContent="Paste the official homepage URL. Its favicon will be fetched automatically.";label.textContent="Website URL";input.setAttribute("aria-label","Website URL");next.textContent="Next";error.textContent="";setTimeout(function(){input.focus()},20)}
  function showName(){stage="name";input.value="";input.type="text";input.inputMode="text";input.autocomplete="off";input.placeholder="Website or app name";title.textContent="Website name";copy.textContent="Enter the name that should appear on the "+(addType==="apps"?"Apps":"Websites")+" grid.";label.textContent="Website name";input.setAttribute("aria-label","Website name");next.textContent="Add to "+(addType==="apps"?"Apps":"Websites");error.textContent="";setTimeout(function(){input.focus()},20)}
  function normaliseUrl(value){
    let raw=value.trim();if(!raw)return "";
